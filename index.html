<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>アオハル 8月スタンプラリー（デモ）</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/popup.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="login-area">
      <button id="btn-login" class="btn-primary">Googleログイン</button>
      <button id="btn-logout" class="btn-ghost" style="display:none">ログアウト</button>
    </div>
    <h1 class="site-title">アオハル 8月スタンプラリー（デモ）</h1>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <div class="characters">
          <img src="images/AoharuRMI.png" alt="RMI" class="char rmi">
          <img src="images/AoharuSNO.png" alt="SNO" class="char sno">
          <img src="images/AoharuJAN.png" alt="JAN" class="char jan">
          <img src="images/AoharuNNS.png" alt="NNS" class="char nns">
        </div>
        <div class="hero-text">
          <h2 class="group-name">アオハル</h2>
          <p class="catch">青空・学校・夏。アオハルな時間を共有しよう。</p>
        </div>
      </div>
    </section>

    <section class="card-section">
      <h2>スタンプカード</h2>
      <div id="card" class="card">
        <img src="images/cardhaikei.png" alt="card background" class="card-bg">
        <div id="stamps-container" class="stamps-container"></div>
      </div>
    </section>

    <section id="debug-panel" class="debug" style="display:none">
      <h3>DEBUG</h3>
      <button id="btn-sync">同期（Local → Firestore）</button>
      <button id="btn-clear-local">LocalStorage 初期化</button>
    </section>
  </main>

  <footer>
    <p>デモ実装 — Firebase 設定は firebase/firebaseConfig.js を差し替えてください。</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stampManager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
