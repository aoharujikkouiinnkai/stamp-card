<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8月限定！配信スタンプカード</title>
    <link rel="stylesheet" href="style.css">
    <script src="images.js" defer></script>
</head>
<body>

    <h1>✨ 8月限定スタンプラリー ✨</h1>
    <div class="info">現在のスタンプ：<span id="stamp-count">0</span> / 35</div>

    <div class="cards-wrapper" id="cards-wrapper"></div>

    <div id="alert-msg" class="alert-msg"></div>

    <div class="debug-controls" style="margin-top: 30px; display: flex; gap: 10px;">
        <button onclick="addDebugStamp('live')" style="padding: 10px; background: #ff7675; color: white; border: none; border-radius: 5px; cursor: pointer;">テストでLive追加</button>
        <button onclick="addDebugStamp('archive')" style="padding: 10px; background: #74b9ff; color: white; border: none; border-radius: 5px; cursor: pointer;">テストでArchive追加</button>
        <button onclick="resetStamps()" style="padding: 10px; background: #6c5ce7; color: white; border: none; border-radius: 5px; cursor: pointer;">全リセット</button>
    </div>

    <script>
        const STAMPS_PER_CARD = 7;
        const TOTAL_CARDS = 5;
        const MAX_STAMPS = STAMPS_PER_CARD * TOTAL_CARDS; 

        // ★スタンプの座標設定（7つの穴の中心位置を土台画像の縦横に対する％で指定）
        const STAMP_POSITIONS = [
            { top: '20%', left: '15%' }, // 1個目の穴
            { top: '35%', left: '45%' }, // 2個目の穴
            { top: '50%', left: '75%' }, // 3個目の穴
            { top: '65%', left: '30%' }, // 4個目の穴
            { top: '72%', left: '60%' }, // 5個目の穴
            { top: '80%', left: '15%' }, // 6個目の穴
            { top: '90%', left: '50%' }  // 7個目の穴
        ];

        let savedData = JSON.parse(localStorage.getItem('stream_stamps_aug')) || { stamps: [], history: [] };

        function renderCards() {
            const wrapper = document.getElementById('cards-wrapper');
            wrapper.innerHTML = '';

            // images.js から画像パスを取得
            const cardBgSrc = (typeof IMAGE_LIST !== 'undefined') ? IMAGE_LIST.cardBase : 'images/cardhaikei.png';
            const stampSrcMap = (typeof IMAGE_LIST !== 'undefined') ? IMAGE_LIST.stamps : { live: 'images/stamp_live.png', archive: 'images/stamp_archive.png' };

            for (let cardIdx = 0; cardIdx < TOTAL_CARDS; cardIdx++) {
                // コンテナを作成
                const container = document.createElement('div');
                container.className = 'card-container';

                // 土台となる画像（cardhaikei.png）を配置
                const bgImg = document.createElement('img');
                bgImg.src = cardBgSrc;
                bgImg.className = 'card-bg';
                container.appendChild(bgImg);

                // スタンプをその上に重ねていく
                for (let stampIdx = 0; stampIdx < STAMPS_PER_CARD; stampIdx++) {
                    const globalIdx = (cardIdx * STAMPS_PER_CARD) + stampIdx;

                    if (savedData.stamps[globalIdx]) {
                        const img = document.createElement('img');
                        img.src = stampSrcMap[savedData.stamps[globalIdx]];
                        img.className = 'stamp-element';
                        
                        const pos = STAMP_POSITIONS[stampIdx];
                        if (pos) {
                            img.style.top = pos.top;
                            img.style.left = pos.left;
                        }
                        container.appendChild(img);
                    }
                }
                wrapper.appendChild(container);
            }
            document.getElementById('stamp-count').innerText = savedData.stamps.length;
        }

        function processStamp() {
            const urlParams = new URLSearchParams(window.location.search);
            const streamId = urlParams.get('id');    
            const type = urlParams.get('type');      
            const isDebug = urlParams.get('debug') === 'true'; 

            if (!streamId || !type) {
                renderCards();
                return;
            }

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; 
            
            if (!isDebug && (currentYear !== 2026 || currentMonth !== 8)) {
                showAlert('このスタンプカードは8月（8/1〜8/31）の期間外は使用できません。', 'error');
                renderCards();
                return;
            }

            if (savedData.stamps.length >= MAX_STAMPS) {
                showAlert('すべてのスタンプカードが満タンになりました！', 'error');
                renderCards();
                return;
            }

            if (savedData.history.includes(streamId)) {
                showAlert('この配信のスタンプはすでに獲得済みです！', 'error');
                renderCards();
                return;
            }

            savedData.stamps.push(type);
            savedData.history.push(streamId);
            localStorage.setItem('stream_stamps_aug', JSON.stringify(savedData));

            showAlert(`${type === 'live' ? '🔥リアルタイム視聴！' : '🎬アーカイブ視聴'} スタンプを押しました！`, 'success');
            renderCards();

            setTimeout(() => {
                const cleanURL = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({}, document.title, cleanURL);
            }, 1500);
        }

        function showAlert(text, className) {
            const alertBox = document.getElementById('alert-msg');
            alertBox.innerText = text;
            alertBox.className = `alert-msg ${className}`;
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        }

        function addDebugStamp(type) {
            if (savedData.stamps.length >= MAX_STAMPS) return;
            savedData.stamps.push(type);
            savedData.history.push('debug_' + Date.now());
            localStorage.setItem('stream_stamps_aug', JSON.stringify(savedData));
            renderCards();
        }

        function resetStamps() {
            savedData = { stamps: [], history: [] };
            localStorage.setItem('stream_stamps_aug', JSON.stringify(savedData));
            renderCards();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCards();
            processStamp();
        });
    </script>
</body>
</html>
