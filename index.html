<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アオハル8月スタンプラリー</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="sky-background"></div>

    <header class="global-header header-glass">
        <div class="header-logo">アオハル実行委員会</div>
        <button id="google-login-btn" class="btn-login">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" class="google-icon">
            <span>Googleでログイン</span>
        </button>
    </header>

    <main class="main-container">
        <section class="hero-section">
            
            <div class="member-wrapper member-rmi position-low" onclick="location.href='profile.html'">
                <div class="stand-image-placeholder">
                    <span class="member-name-tag">RMI</span>
                    </div>
            </div>

            <div class="member-wrapper member-sno position-high" onclick="location.href='profile.html'">
                <div class="stand-image-placeholder">
                    <span class="member-name-tag">SNO</span>
                    </div>
            </div>

            <div class="center-content-card glass-panel">
                <h1 class="group-title">アオハル実行委員会</h1>
                <p class="catch-copy">「僕たちの夏は、きっと終わらない。」</p>
                <div class="divider"></div>
                <p class="description">
                    8月限定の特別配信スタンプラリーへようこそ。<br>
                    リアルタイムで配信を視聴して、限定スタンプと特別なボイスを集めよう。
                </p>
                <a href="#stamp-section" class="btn-primary">スタンプカードを見る</a>
            </div>

            <div class="member-wrapper member-jan position-high" onclick="location.href='profile.html'">
                <div class="stand-image-placeholder">
                    <span class="member-name-tag">JAN</span>
                    </div>
            </div>

            <div class="member-wrapper member-nns position-low" onclick="location.href='profile.html'">
                <div class="stand-image-placeholder">
                    <span class="member-name-tag">NNS</span>
                    </div>
            </div>

        </section>

        <section id="stamp-section" class="stamp-section">
            </section>
    </main>

</body>
</html>
