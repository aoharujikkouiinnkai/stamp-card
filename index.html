<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アオハル8月スタンプラリー</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">  
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/popup.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div class="sky-background"></div>

    <header class="global-header header-glass">
        <div class="header-logo">アオハル実行委員会</div>
        <button id="google-login-btn" class="btn-login">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" class="google-icon">
            <span>Googleでログイン</span>
        </button>
    </header>

    <main class="main-container">
        <section class="hero-section">
            
            <div class="member-wrapper member-rmi position-low" onclick="location.href='profile.html?member=rmi'">
                <div class="stand-image-container">
                    <img src="images/AoharuRMI.png" alt="RMI" class="member-img">
                    <span class="member-name-tag">RMI</span>
                </div>
            </div>

            <div class="member-wrapper member-sno position-high" onclick="location.href='profile.html?member=sno'">
                <div class="stand-image-container">
                    <img src="images/AoharuSNO.png" alt="SNO" class="member-img">
                    <span class="member-name-tag">SNO</span>
                </div>
            </div>

            <div class="center-content-card glass-panel">
                <h1 class="group-title">アオハル実行委員会</h1>
                <p class="catch-copy">「僕たちの夏は、きっと終わらない。」</p>
                <div class="divider"></div>
                <p class="description">
                    8月限定の特別配信スタンプラリーへようこそ。<br>
                    リアルタイムで配信を視聴して、限定スタンプと特別なボイスを集めよう。
                </p>
                <a href="#stamp-section" class="btn-primary">スタンプカードを見る</a>
            </div>

            <div class="member-wrapper member-jan position-high" onclick="location.href='profile.html?member=jan'">
                <div class="stand-image-container">
                    <img src="images/AoharuJAN.png" alt="JAN" class="member-img">
                    <span class="member-name-tag">JAN</span>
                </div>
            </div>

            <div class="member-wrapper member-nns position-low" onclick="location.href='profile.html?member=nns'">
                <div class="stand-image-container">
                    <img src="images/AoharuNNS.png" alt="NNS" class="member-img">
                    <span class="member-name-tag">NNS</span>
                </div>
            </div>

        </section>

        <section id="stamp-section" class="stamp-section">
            <div class="section-title-area">
                <h2 class="section-title">Aoharu Stamp Card</h2>
                <p class="section-subtitle">8月の思い出を刻もう</p>
            </div>

            <div class="cards-container">
                
                <div class="stamp-card-wrapper">
                    <div class="stamp-card-inner">
                        <img src="images/cardhaikei.png" alt="Card Background" class="card-bg-img">
                        
                        <div class="stamp-slot slot-sat" style="left: 16.2%; top: 75.1%;">
                            <span class="date-badge">8/1</span>
                            <div class="stamp-trigger" onclick="alert('配信情報モーダルを表示')">
                                <img src="images/stamp_R1.png" alt="Stamp" class="stamp-icon active">
                            </div>
                        </div>

                        <div class="stamp-slot slot-sun" style="left: 28.3%; top: 33.4%;">
                            <span class="date-badge">8/2</span>
                            <div class="stamp-trigger">
                                <img src="images/stamp_archive.png" alt="Stamp" class="stamp-icon active">
                            </div>
                        </div>

                        <div class="stamp-slot slot-mon" style="left: 39.4%; top: 76.8%;">
                            <span class="date-badge">8/3</span>
                            <div class="stamp-trigger">
                                <div class="stamp-placeholder"></div>
                            </div>
                        </div>

                        <div class="stamp-slot slot-tue" style="left: 50.9%; top: 33.9%;">
                            <span class="date-badge">8/4</span>
                            <div class="stamp-trigger">
                                <div class="stamp-placeholder"></div>
                            </div>
                        </div>

                        <div class="stamp-slot slot-wed" style="left: 61.9%; top: 75.5%;">
                            <span class="date-badge">8/5</span>
                            <div class="stamp-trigger">
                                <div class="stamp-placeholder"></div>
                            </div>
                        </div>

                        <div class="stamp-slot slot-thu" style="left: 72.9%; top: 36.2%;">
                            <span class="date-badge">8/6</span>
                            <div class="stamp-trigger">
                                <div class="stamp-placeholder"></div>
                            </div>
                        </div>

                        <div class="stamp-slot slot-fri" style="left: 84.4%; top: 75.6%;">
                            <span class="date-badge">8/7</span>
                            <div class="stamp-trigger">
                                <div class="stamp-placeholder"></div>
                            </div>
                        </div>

                    </div>
                    <div class="card-footer-info">1st Week (8/1 - 8/7)</div>
                </div>

            </div> 
        </section>
    </main>

    <script type="module">
        // Firebaseの基本機能とAuth（ログイン）、Firestore（DB）の読み込み
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // 1. Firebaseの初期化（★ステップ1のあなたのConfigに書き換えてください）
        const firebaseConfig = {
          apiKey: "AIzaSyDfdA0SWO8YY-AazrxKAWFXpAccsUY0JiQ",
          authDomain: "stamp-card-7272f.firebaseapp.com",
          projectId: "stamp-card-7272f",
          storageBucket: "stamp-card-7272f.firebasestorage.app",
          messagingSenderId: "440814955407",
          appId: "1:440814955407:web:490528d0d37465c066f9fa",
          measurementId: "G-1SQCYTC3G2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ==========================================================================
        // 2. Googleログイン機能の実装
        // ==========================================================================
        const loginBtn = document.getElementById('google-login-btn');

        // ログインボタンをクリックした時の処理
        loginBtn.addEventListener('click', async () => {
            // すでにログインしている場合はログアウト処理にする
            if (auth.currentUser) {
                await signOut(auth);
                alert('ログアウトしました');
                return;
            }

            // 未ログインの場合はGoogleポップアップサインインを実行
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                alert(`こんにちは、${user.displayName} さん！`);
                
                // Firestoreにユーザー初期データを保存（存在しなければ作成）
                await initUserDocument(user);
                
            } catch (error) {
                console.error("ログインエラー:", error);
                alert("ログインに失敗しました。");
            }
        });

        // ユーザーのログイン状態を監視する（ページを開いた時に自動で実行される）
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ログイン中：ボタンのテキストを「ログアウト」に変更
                loginBtn.innerHTML = `
                    <img src="${user.photoURL}" alt="User Avatar" class="google-icon" style="border-radius: 50%;">
                    <span>ログアウト</span>
                `;
                console.log("ログイン中のユーザー:", user.uid);
                // TODO: ここでユーザーのスタンプ取得状況をFirestoreから読み込んで画面に反映する
            } else {
                // 未ログイン：ボタンを元の状態に戻す
                loginBtn.innerHTML = `
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" class="google-icon">
                    <span>Googleでログイン</span>
                `;
            }
        });

        // Firestoreにユーザーの初期枠を作る関数
        async function initUserDocument(user) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            // まだFirestoreにデータがない新規ユーザーの場合のみ作成
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    createdAt: new Date().toISOString(),
                    stamps: {} // 最初はスタンプ空っぽ
                });
                console.log("新しいユーザーをFirestoreに登録しました");
            }
        }
    </script>
</body>
</html>
