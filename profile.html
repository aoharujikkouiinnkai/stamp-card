<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバープロフィール - アオハル8月スタンプラリー</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sky-background"></div>

    <main class="profile-single-container">
        
        <div class="profile-header-actions">
            <a href="index.html" class="btn-back">← トップページに戻る</a>
        </div>

        <div class="profile-single-card glass-panel" id="profile-card-container">
            
            <div class="profile-left-stage">
                <div class="profile-standalone-image-wrapper">
                    <img id="js-member-img" src="" alt="メンバー立ち絵" class="single-member-img">
                </div>
            </div>

            <div class="profile-right-info">
                <div id="js-member-color-badge" class="single-color-badge">COLOR</div>
                <h1 id="js-member-name" class="single-member-name">Loading...</h1>
                
                <div class="intro-box">
                    <p id="js-member-intro" class="single-member-intro">
                        読み込み中...
                    </p>
                </div>

                <div class="single-profile-links">
                    <a id="js-yt-link" href="#" target="_blank" class="link-item yt-link">YouTubeチャンネル</a>
                    <a id="js-sns-link" href="#" target="_blank" class="link-item sns-link">X (Twitter)</a>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 擬似的なデータ（将来は profiles.json から読み込みます）
        const memberData = {
            rmi: { name: "RMI", color: "#007aff", img: "images/AoharuRMI.png", intro: "アオハル実行委員会のリーダー。夏が誰よりも似合う元気いっぱいの男の子。みんなを引っ張る太陽のような存在です！青空のように真っ直ぐな性格。", yt: "https://youtube.com/...", sns: "https://x.com/..." },
            sno: { name: "SNO", color: "#4fc3f7", img: "images/AoharuSNO.png", intro: "クールでマイペースなアオハルのまとめ役。少し照れ屋だけど、配信への情熱は人一倍。夕方の静かな海と波の音が大好き。", yt: "https://youtube.com/...", sns: "https://x.com/..." },
            jan: { name: "JAN", color: "#81c784", img: "images/AoharuJAN.png", intro: "いつも笑顔でアオハルのムードメーカー！おしゃべりが大好きで、リスナーとの距離が一番近い。炭酸飲料と夏フェスが生きがい。", yt: "https://youtube.com/...", sns: "https://x.com/..." },
            nns: { name: "NNS", color: "#ffb1c1", img: "images/AoharuNNS.png", intro: "おっとりしていて癒やし系な最年少。音楽をこよなく愛しており、8月に投稿される『歌ってみた』動画のクオリティには絶対の自信があります。", yt: "https://youtube.com/...", sns: "https://x.com/..." }
        };

        // URLパラメータ（?member=rmi など）を取得
        const urlParams = new URLSearchParams(window.location.search);
        const memberKey = urlParams.get('member') || 'rmi'; // 指定がない場合はRMIをデフォルトに

        // 該当メンバーのデータを画面に反映
        const member = memberData[memberKey];
        if (member) {
            document.getElementById('js-member-name').innerText = member.name;
            document.getElementById('js-member-img').src = member.img;
            document.getElementById('js-member-img').alt = member.name;
            document.getElementById('js-member-intro').innerText = member.intro;
            document.getElementById('js-yt-link').href = member.yt;
            document.getElementById('js-sns-link').href = member.sns;
            
            // 担当色バッジの背景色を動的に変更
            const badge = document.getElementById('js-member-color-badge');
            badge.style.backgroundColor = member.color;
        }
    </script>
</body>
</html>
